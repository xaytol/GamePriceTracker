services:
  db:
    image: postgres:15-alpine
    container_name: gpt_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_tracker
    ports:
      - "5432:5432" # Можно убрать, если не нужен доступ с хост-машины
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gpt_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: gpt_app
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Монтируем папку app для hot-reload при разработке
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    container_name: gpt_celery
    restart: always
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      - db
      - redis
    # Команда для запуска воркера (предполагает, что celery_app находится в app/core/celery_app.py)
    command: celery -A app.core.celery_app worker --loglevel=info

volumes:
  postgres_data: