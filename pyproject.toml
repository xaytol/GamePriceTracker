[project]
name = "game-price-tracker"
version = "0.1.0"
description = "REST API для трекинга цен на игры"
authors = [
    {name = "dmitry", email = "fsjdyvf@gmail.com"}
]
readme = "README.md"
# ВАЖНО: Ограничиваем верхнюю границу, чтобы пакеты не ругались на гипотетический Python 4.0
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi (>=0.110.0,<0.115.0)",
    "uvicorn[standard] (>=0.27.1,<0.31.0)",
    "sqlalchemy[asyncio] (>=2.0.27,<2.1.0)",
    "asyncpg (>=0.29.0,<0.31.0)",
    "pydantic (>=2.6.1,<3.0.0)",
    "pydantic-settings (>=2.1.0,<3.0.0)",
    "alembic (>=1.13.1,<2.0.0)",
    "loguru (>=0.7.2,<0.8.0)",
    "celery[redis] (>=5.4.0,<5.5.0)",
]

[tool.poetry]
# Мы переименовали папку в app, поэтому указываем здесь app
packages = [{include = "app"}] 

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.23.5,<0.25.0)",
    "httpx (>=0.27.0,<0.29.0)"
]